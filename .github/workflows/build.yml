name: build memd

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  KERNEL_COMMON: https://android.googlesource.com/kernel/common

jobs:
  build-kmod:
    strategy:
      matrix:
        kernel:
          - name: avd-ranchu-6.1.23
            ref: 7e35917775b8
          - name: gki-5.15
            ref: android14-5.15
          - name: gki-6.1
            ref: android14-6.1
          - name: gki-6.6
            ref: android15-6.6
      fail-fast: false
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu ccache libelf-dev

      - name: cache kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: |
            kernel/${{ matrix.kernel.name }}
            ~/.cache/ccache
          key: kmod-${{ matrix.kernel.name }}-${{ github.sha }}
          restore-keys: kmod-${{ matrix.kernel.name }}-

      - name: checkout kernel
        run: |
          if [ -f kernel/${{ matrix.kernel.name }}/Makefile ]; then
            echo "kernel source already present (cache restore)"
          else
            rm -rf kernel/${{ matrix.kernel.name }}
            case "${{ matrix.kernel.name }}" in
              gki-*)
                git clone --depth=1 --branch ${{ matrix.kernel.ref }} \
                  ${{ env.KERNEL_COMMON }} \
                  kernel/${{ matrix.kernel.name }}
                ;;
              avd-*)
                # specific commit — download tarball from gitiles
                mkdir -p kernel/${{ matrix.kernel.name }}
                curl -sL "${{ env.KERNEL_COMMON }}/+archive/${{ matrix.kernel.ref }}.tar.gz" \
                  | tar xz -C kernel/${{ matrix.kernel.name }}
                ;;
              *)
                echo "unknown kernel name: ${{ matrix.kernel.name }}"
                exit 1
                ;;
            esac
          fi

      - name: prepare kernel build
        run: |
          cd kernel/${{ matrix.kernel.name }}
          if [ ! -f .config ]; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          else
            echo ".config already present, skipping prepare"
          fi

      - name: build module
        run: |
          export CCACHE_DIR=$HOME/.cache/ccache
          cd kernel/${{ matrix.kernel.name }}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache aarch64-linux-gnu-gcc" \
            M=$GITHUB_WORKSPACE/module modules -j$(nproc) \
            KBUILD_MODPOST_WARN=1

      - name: rename artifact
        run: |
          cp module/memd_kern.ko memd_kern-${{ matrix.kernel.name }}.ko

      - uses: actions/upload-artifact@v4
        with:
          name: memd_kern-${{ matrix.kernel.name }}
          path: memd_kern-${{ matrix.kernel.name }}.ko

  build-userspace:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - name: install toolchain
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          echo "CC=$PWD/android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" >> $GITHUB_ENV

      - name: build binaries
        run: |
          $CC -static -O2 -s -o debugd_unsafe module/memd_us.c
          $CC -static -O2 -s -o memtool module/memd_dump.c

      - uses: actions/upload-artifact@v4
        with:
          name: debugd_unsafe
          path: debugd_unsafe

      - uses: actions/upload-artifact@v4
        with:
          name: memtool
          path: memtool

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-kmod, build-userspace]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: collect artifacts
        run: |
          mkdir -p _release
          find _artifacts -type f \( -name "*.ko" -o -name "debugd_unsafe" -o -name "memtool" \) \
            -exec cp {} _release/ \;
          ls -lh _release/

      - uses: ncipollo/release-action@v1
        with:
          tag: beta
          name: "beta build"
          body: "auto-built from ${{ github.sha }}"
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: "_release/*"
