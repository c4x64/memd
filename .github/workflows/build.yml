name: build-kmod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── The 6 fixed stock KMI builds ────────────────────────────────────────
  # One .ko per GKI kernel major. rwbridge.c resolves all struct offsets and
  # the VA geometry from THIS kernel's own headers at build time (offsetof(),
  # PAGE_OFFSET/TASK_SIZE, pgtable shifts), so each build is correct for its
  # kernel with no offsets file. Vermagic encodes the full release (w.x.y),
  # so a .ko only loads on a kernel with an exact vermagic match.
  #
  # The 7th entry (5.15-vendor) is the BlueStacks (bst) emulator's vendor
  # kernel: same 5.15.137 base but with the vendor LOCALVERSION so the
  # vermagic matches exactly, and a hand-written Module.symvers whose CRCs
  # were extracted from the device's own modules (the vendor config can't be
  # reproduced by a stock vmlinux build).
  kmod:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - kver: "5.10.209"
          tag: "5.10"
        - kver: "5.15.137"
          tag: "5.15"
        - kver: "6.1.90"
          tag: "6.1"
        - kver: "6.6.50"
          tag: "6.6"
        - kver: "6.12.20"
          tag: "6.12"
        - kver: "6.18"            # pin to a stable 6.18.y patch before enabling
          tag: "6.18"
        # bst / BlueStacks vendor kernel: 5.15.137 with the vendor LOCALVERSION
        # and CRCs pulled from the device's own bst modules.
        - kver: "5.15.137"
          localver: "-v5.21.770-optimizations-5.21.771.4051"
          tag: "5.15-vendor"
          hand_crcs: "1"
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KVER: ${{ matrix.kver }}
      LOCALVER: ${{ matrix.localver || '' }}
      TAG: ${{ matrix.tag }}
      HAND_CRCS: ${{ matrix.hand_crcs || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev bison flex

      - name: Fetch & extract kernel source
        run: |
          # cdn.kernel.org has outages; fall through every known mirror,
          # with retries, then the git snapshot as last resort.
          MAJ=${KVER%%.*}
          for try in 1 2 3; do
            for base in \
              "https://cdn.kernel.org/pub/linux/kernel/v${MAJ}.x" \
              "https://mirrors.edge.kernel.org/pub/linux/kernel/v${MAJ}.x" \
              "https://www.kernel.org/pub/linux/kernel/v${MAJ}.x" \
              "https://mirrors.tuna.tsinghua.edu.cn/kernel/v${MAJ}.x"; do
              wget -q --timeout=90 "$base/linux-$KVER.tar.xz" && break 2
              rm -f linux-$KVER.tar.xz
            done
            echo "mirror pass $try failed; retrying"
            sleep 10
          done
          [ -f linux-$KVER.tar.xz ] || \
            git clone --depth 1 --branch "v$KVER" \
              https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
              linux-$KVER || true
          [ -f linux-$KVER.tar.xz -o -d linux-$KVER ] || { echo "no source for $KVER"; exit 1; }
          if [ ! -d linux-$KVER ]; then tar xf linux-$KVER.tar.xz; fi
          # second tree for the clang/KCFI pass — kbuild forbids mixing a
          # gcc-dirtied in-tree build with O=, and flavors must stay isolated.
          mkdir -p /tmp/kx
          cp -a linux-$KVER /tmp/kx/

      - name: Configure kernel to match target vermagic
        run: |
          cd linux-$KVER
          make ARCH=$ARCH defconfig
          scripts/config --disable LOCALVERSION_AUTO
          scripts/config --set-str LOCALVERSION "$LOCALVER"
          scripts/config --enable MODULES
          scripts/config --enable MODULE_UNLOAD
          scripts/config --enable MODVERSIONS
          scripts/config --enable SMP
          scripts/config --enable PREEMPT
          make ARCH=$ARCH olddefconfig
          if [ -n "$HAND_CRCS" ]; then
            # bst vendor kernel: the CRCs below were extracted from the
            # device's own modules' __versions sections (this exact 5.15.137
            # vendor config can't be reproduced by a stock vmlinux build).
            # rwbridge.c links module_layout + _printk (+ memset emitted by the
            # compiler for kernel-header inline helpers pulled in by the
            # discovery ops; kept in the symvers or modpost fails with
            # "memset undefined"). Since 4dc38b0 the arm64 memory.h PAGE_OFFSET
            # macro also references the exported int vabits_actual when built
            # with a non-48-bit VA config, so modpost needs that CRC too
            # ("vabits_actual undefined"). All CRCs are from the stock 5.15.137
            # vmlinux EXCEPT module_layout, which is the device's own
            # __versions value (0x93375eb6).
            printf '0x93375eb6\tmodule_layout\tvmlinux\tEXPORT_SYMBOL\t\n0x92997ed8\t_printk\tvmlinux\tEXPORT_SYMBOL\t\n0xdcb764ad\tmemset\tvmlinux\tEXPORT_SYMBOL\t\n0xc56a41e6\tvabits_actual\tvmlinux\tEXPORT_SYMBOL\t\n' > Module.symvers
            make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE prepare modules_prepare scripts
          else
            # Stock kernel: build vmlinux so modpost emits the real
            # EXPORT_SYMBOL CRCs for this exact kernel+config.
            make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE -j$(nproc) vmlinux
            # Build vmlinux but Module.symvers comes from modpost.
            [ ! -f Module.symvers ] && [ -f vmlinux.symvers ] && cp vmlinux.symvers Module.symvers
            make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE prepare modules_prepare scripts
          fi
          ls -la Module.symvers
          head -5 Module.symvers

      - name: Build kmod (gcc flavor — vendor kernels without CFI)
        run: |
          cd kmod
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE KDIR="$GITHUB_WORKSPACE/linux-$KVER"
          cp rwbridge.ko rwbridge-gcc.ko

      - name: Build kmod (clang KCFI flavor — GKI CONFIG_CFI_CLANG kernels)
        # GKI 5.15+ kernels instrument indirect calls (CONFIG_CFI_CLANG):
        # every kernel->module callback (param .set/.get, i.e. the whole
        # sysfs interface) traps unless the module carries matching KCFI
        # type hashes. Those come from clang -fsanitize=kcfi.
        # Uses the SECOND pristine tree (LLVM=1 end to end). Module.symvers
        # is copied from the gcc pass — genksyms CRCs derive from C types,
        # not compiler, so they stay valid.
        run: |
          sudo apt-get install -y clang lld llvm >/dev/null 2>&1 || true
          KSRC_GCC=$GITHUB_WORKSPACE/linux-$KVER
          KSRC=/tmp/kx/linux-$KVER
          cd $KSRC
          make ARCH=$ARCH LLVM=1 defconfig
          make ARCH=$ARCH LLVM=1 -j$(nproc) prepare modules_prepare scripts 2>/dev/null || \
            { ./scripts/config -d DEBUG_INFO_REDUCED -d DEBUG_INFO_SPLIT \
                -d GDB_SCRIPTS; make ARCH=$ARCH LLVM=1 olddefconfig; \
              make ARCH=$ARCH LLVM=1 -j$(nproc) prepare modules_prepare scripts; }
          for S in $KSRC_GCC/Module.symvers $GITHUB_WORKSPACE/Module.symvers; do
            [ -f "$S" ] && cp "$S" $KSRC/ && break
          done
          ls -la $KSRC/Module.symvers
          cd $GITHUB_WORKSPACE/kmod
          rm -f rwbridge.o rwbridge.ko
          make ARCH=$ARCH LLVM=1 KCFLAGS="-fsanitize=kcfi" KDIR=$KSRC
          cp rwbridge.ko rwbridge-kcfi.ko

      - name: Show vermagic
        run: |
          modinfo kmod/rwbridge-gcc.ko || \
          aarch64-linux-gnu-objcopy -O binary --only-section=.modinfo \
            kmod/rwbridge-gcc.ko /dev/stdout | strings | grep -i vermagic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rwbridge-${{ matrix.kver }}${{ matrix.localver || '' }}
          path: |
            kmod/rwbridge-gcc.ko
            kmod/rwbridge-kcfi.ko