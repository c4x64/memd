name: build-kmod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── The 6 fixed stock KMI builds ────────────────────────────────────────
  # One .ko per GKI kernel major. rwbridge.c resolves all struct offsets and
  # the VA geometry from THIS kernel's own headers at build time (offsetof(),
  # PAGE_OFFSET/TASK_SIZE, pgtable shifts), so each build is correct for its
  # kernel with no offsets file. Vermagic encodes the full release (w.x.y),
  # so a .ko only loads on a kernel with an exact vermagic match.
  #
  # The 7th entry (5.15-vendor) is the BlueStacks (bst) emulator's vendor
  # kernel: same 5.15.137 base but with the vendor LOCALVERSION so the
  # vermagic matches exactly, and a hand-written Module.symvers whose CRCs
  # were extracted from the device's own modules (the vendor config can't be
  # reproduced by a stock vmlinux build).
  kmod:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - kver: "5.10.209"
          tag: "5.10"
        - kver: "5.15.137"
          tag: "5.15"
        - kver: "6.1.90"
          tag: "6.1"
        - kver: "6.6.50"
          tag: "6.6"
        - kver: "6.12.20"
          tag: "6.12"
        - kver: "6.18"            # pin to a stable 6.18.y patch before enabling
          tag: "6.18"
        # bst / BlueStacks vendor kernel: 5.15.137 with the vendor LOCALVERSION
        # and CRCs pulled from the device's own bst modules.
        - kver: "5.15.137"
          localver: "-v5.21.770-optimizations-5.21.771.4051"
          tag: "5.15-vendor"
          hand_crcs: "1"
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KVER: ${{ matrix.kver }}
      LOCALVER: ${{ matrix.localver || '' }}
      TAG: ${{ matrix.tag }}
      HAND_CRCS: ${{ matrix.hand_crcs || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev bison flex

      - name: Fetch & extract kernel source
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-$KVER.tar.xz || \
            wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz || \
            { echo "no tarball for $KVER"; exit 1; }
          tar xf linux-$KVER.tar.xz

      - name: Configure kernel to match target vermagic
        run: |
          cd linux-$KVER
          make ARCH=$ARCH defconfig
          scripts/config --disable LOCALVERSION_AUTO
          scripts/config --set-str LOCALVERSION "$LOCALVER"
          scripts/config --enable MODULES
          scripts/config --enable MODULE_UNLOAD
          scripts/config --enable MODVERSIONS
          scripts/config --enable SMP
          scripts/config --enable PREEMPT
          make ARCH=$ARCH olddefconfig
          if [ -n "$HAND_CRCS" ]; then
            # bst vendor kernel: the CRCs below were extracted from the
            # device's own modules' __versions sections (this exact 5.15.137
            # vendor config can't be reproduced by a stock vmlinux build).
            # rwbridge.c links only module_layout + _printk.
            printf '0x93375eb6\tmodule_layout\tvmlinux\tEXPORT_SYMBOL\t\n0x92997ed8\t_printk\tvmlinux\tEXPORT_SYMBOL\t\n' > Module.symvers
            make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE prepare modules_prepare scripts
          else
            # Stock kernel: build vmlinux so modpost emits the real
            # EXPORT_SYMBOL CRCs for this exact kernel+config.
            make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE -j$(nproc) vmlinux
            # Build vmlinux but Module.symvers comes from modpost.
            [ ! -f Module.symvers ] && [ -f vmlinux.symvers ] && cp vmlinux.symvers Module.symvers
            make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE prepare modules_prepare scripts
          fi
          ls -la Module.symvers
          head -5 Module.symvers

      - name: Build kmod
        run: |
          cd kmod
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE KDIR="$GITHUB_WORKSPACE/linux-$KVER"

      - name: Show vermagic
        run: |
          modinfo kmod/rwbridge.ko || \
          aarch64-linux-gnu-objcopy -O binary --only-section=.modinfo \
            kmod/rwbridge.ko /dev/stdout | strings | grep -i vermagic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rwbridge-${{ matrix.kver }}${{ matrix.localver || '' }}
          path: kmod/rwbridge.ko