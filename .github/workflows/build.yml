name: build-matrix-kmod

# rwbridge is built once PER KMI GENERATION (8 DDK targets) PLUS ONE
# UNIVERSAL image (5.10-baseline build of the same source: no kprobe
# imports, no version-conditional behavior — runtime adaptation only).
# Each matrix artifact matches its own generation's headers/layouts (and
# proves the source is header-agnostic on all 8); vendor variance inside
# a generation (UTS suffixes) is absorbed at install by the vermagic
# placeholder + run.sh/SPX patch. Deliverables: ONE packed binary
# (rwbridge-spx, universal + 8 artifacts inside) + one shell bundle.
#
# DDK provides containerized kernel trees per KMI (no source on any
# device, never in this repo). ddk_release is pinned; bumping it is a
# deliberate, reviewed change (new compiler/headers alter every artifact).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.img }}-20251016
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - kmi: universal
            img: android12-5.10
          - kmi: android12-5.10
            img: android12-5.10
          - kmi: android13-5.10
            img: android13-5.10
          - kmi: android13-5.15
            img: android13-5.15
          - kmi: android14-5.15
            img: android14-5.15
          - kmi: android14-6.1
            img: android14-6.1
          - kmi: android14-6.1-dbg
            img: android14-6.1
            dbg: true
          - kmi: android15-6.6
            img: android15-6.6
          - kmi: android16-6.12
            img: android16-6.12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve + build + gate ${{ matrix.kmi }}
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: 1
          LLVM_IAS: 1
        run: |
          echo "=== KMI: ${{ matrix.kmi }} ==="
          IMG="${{ matrix.img }}"
          KDIR_RESOLVED="${KERNEL_SRC:-/opt/ddk/kdir/$IMG}"
          [ -d "$KDIR_RESOLVED" ] || KDIR_RESOLVED="/opt/ddk/kdir/$IMG"
          [ -d "$KDIR_RESOLVED" ] || { echo "FATAL: no kdir for $IMG (KERNEL_SRC=$KERNEL_SRC)"; ls /opt/ddk/kdir/; exit 1; }
          echo "kdir=$KDIR_RESOLVED"
          ls "$KDIR_RESOLVED" | head -20
          # Exact layout export through kbuild itself (raw clang can't
          # replicate kbuild's include architecture): a TU whose array
          # sizes ARE the offsetof values, then read them with nm.
          {
            echo '#include <net/sock.h>';
            echo '#include <linux/net.h>';
            echo '#include <linux/fs.h>';
            echo '#include <linux/sched.h>';
            echo '#include <linux/mm.h>';
            echo '#include <linux/dcache.h>';
            echo '#include <linux/cred.h>';
            echo '#include <linux/utsname.h>';
            echo '#define X(p, s, m) __attribute__((used)) char _w_##p##_##m[(unsigned)__builtin_offsetof(s, m) + 1] = {0}';
            echo 'X(p, struct proto, obj_size); X(p, struct proto, slab); X(p, struct proto, name); X(p, struct proto, owner); X(p, struct proto, slab_flags); X(p, struct proto, max_header);';
            echo 'X(p, struct proto, useroffset); X(p, struct proto, usersize); X(p, struct proto, orphan_count); X(p, struct proto, rsk_prot); X(p, struct proto, twsk_prot); X(p, struct proto, node); X(p, struct proto, diag_destroy);';
            echo '#include <linux/version.h>';
            echo '#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)';
            echo 'X(p, struct proto, per_cpu_fw_alloc);';
            echo '#endif';
            echo 'X(o, struct proto_ops, release); X(o, struct proto_ops, mmap); X(o, struct proto_ops, accept); X(o, struct proto_ops, owner); X(o, struct proto_ops, family);';
            echo 'X(f, struct net_proto_family, family); X(f, struct net_proto_family, create); X(f, struct net_proto_family, owner);';
            echo 'X(d, struct dir_context, actor); X(d, struct dir_context, pos);';
            echo 'X(u, struct new_utsname, sysname); X(u, struct new_utsname, nodename); X(u, struct new_utsname, release); X(u, struct new_utsname, machine);';
            echo 'X(t, struct task_struct, mm); X(t, struct task_struct, comm); X(t, struct task_struct, pid); X(t, struct task_struct, tgid); X(t, struct task_struct, cred); X(t, struct task_struct, real_parent); X(t, struct task_struct, prio);';
            echo 'X(c, struct cred, uid);';
            echo 'X(m, struct mm_struct, pgd); X(m, struct mm_struct, arg_start); X(m, struct mm_struct, arg_end); X(m, struct mm_struct, mmap);';
            echo 'X(v, struct vm_area_struct, vm_start); X(v, struct vm_area_struct, vm_end); X(v, struct vm_area_struct, vm_file); X(v, struct vm_area_struct, vm_flags); X(v, struct vm_area_struct, vm_next);';
            echo 'X(e, struct dentry, d_name);';
            echo 'X(fl, struct file, f_op); X(fl, struct file, f_path);';
            echo 'X(fo, struct file_operations, iterate_shared); X(fo, struct file_operations, owner);';
            echo 'MODULE_LICENSE("GPL");';
          } > /tmp/wuwa_offexp.c
          mkdir -p /tmp/expmod && cp /tmp/wuwa_offexp.c /tmp/expmod/ && printf 'obj-m += wuwa_offexp.o\n' > /tmp/expmod/Makefile
          make -C "$KDIR_RESOLVED" M=/tmp/expmod modules 2>&1 | grep -iE "error|warning: unused|wuwa_offexp" | head -8
          (NMX=""; for t in llvm-nm aarch64-linux-gnu-nm nm; do command -v $t >/dev/null 2>&1 && { NMX=$t; break; }; done; \
           $NMX -S /tmp/expmod/wuwa_offexp.o 2>/dev/null | grep _w_ | head -25) || \
            echo "offexp kbuild unavailable"
          rm -rf /tmp/expmod /tmp/wuwa_offexp.c
          # Header forensics (universal runtime-build tables): dump the
          # kernel-consumed struct layouts per generation so field offsets
          # can be computed for the runtime-constructed tables. Full
          # structs, no truncation. (Sources live under /opt/ddk/src,
          # not the kdir build link.)
          for HDR in "/opt/ddk/src/$IMG" "$KDIR_RESOLVED"; do
            if [ -f "$HDR/include/net/sock.h" ]; then
              echo "=== FULL struct proto ($IMG) ==="
              awk '/^struct proto {/,/^};/' "$HDR/include/net/sock.h"
              echo "=== FULL struct proto_ops ($IMG) ==="
              awk '/^struct proto_ops {/,/^};/' "$HDR/include/linux/net.h"
              echo "=== struct new_utsname ($IMG) ==="
              grep -n -A12 "struct new_utsname" "$HDR/include/uapi/linux/utsname.h" | head -16
              echo "=== FULL struct net_proto_family ($IMG) ==="
              awk '/^struct net_proto_family {/,/^};/' "$HDR/include/linux/net.h"
              echo "=== FULL struct dir_context ($IMG) ==="
              awk '/^struct dir_context {/,/^};/' "$HDR/include/linux/fs.h"
              break
            fi
          done
          NM_BIN=""; for t in llvm-nm aarch64-linux-gnu-nm nm; do command -v $t >/dev/null 2>&1 && { NM_BIN=$t; break; }; done
          OBJCOPY_BIN=""; for t in llvm-objcopy aarch64-linux-gnu-objcopy objcopy; do command -v $t >/dev/null 2>&1 && { OBJCOPY_BIN=$t; break; }; done
          echo "$OBJCOPY_BIN" > "$GITHUB_WORKSPACE/.objcopy"
          OBJDUMP_BIN=""; for t in llvm-objdump aarch64-linux-gnu-objdump objdump; do command -v $t >/dev/null 2>&1 && { OBJDUMP_BIN=$t; break; }; done
          echo "tools: NM=$NM_BIN OBJDUMP=$OBJDUMP_BIN"
          [ -n "$NM_BIN" ] && [ -n "$OBJDUMP_BIN" ] || { echo "FATAL: no nm/objdump"; exit 1; }
          export PATH="$(echo /opt/ddk/clang/*/bin | cut -d' ' -f1):$PATH"
          # No Kconfig tooling in DDK images (no scripts/config): CRCs are
          # stripped post-build instead (objcopy below). Enforcing loaders
          # warn-and-pass CRC-less modules; non-enforcing ignore them.
          BASEUTS=$(cd "$KDIR_RESOLVED" && make -s kernelrelease 2>/dev/null || echo "0.0.0")
          echo "donor UTS: $BASEUTS"
          # Pad via a localversion file (kbuild appends localversion* to
          # UTS; EXTRAVERSION overrides proved unreliable here). Target 63
          # total: every real vermagic then fits the in-place runtime patch
          # (patch only ever shrinks; kbuild fails past 64, loud).
          # Remove any stale memd pad first (idempotent reruns).
          rm -f "$KDIR_RESOLVED/localversion-memd"
          BLEN=${#BASEUTS}
          if [ "$BLEN" -lt 63 ]; then
            python3 -c "open('$KDIR_RESOLVED/localversion-memd','w').write('x'*$((63 - $BLEN)))"
          fi
          echo "padded UTS: $(cd "$KDIR_RESOLVED" && make -s kernelrelease 2>/dev/null)"
          # External-module builds reuse the image's stale generated UTS
          # (setlocalversion does not rerun for M= builds): delete the
          # stale files so the pad above takes effect at build time.
          # M= builds never regenerate these (proven: deleting breaks
          # vermagic.h); rewrite in place with padded UTS (<=63 chars).
          CURUTS=$(grep -o '"[^"]*"' "$KDIR_RESOLVED/include/generated/utsrelease.h" | head -1 | tr -d '"')
          CLEN=${#CURUTS}
          if [ "$CLEN" -ge 63 ]; then echo "UTS already roomy: $CURUTS"; else
            PADUTS="${CURUTS}$(python3 -c "print('x'*$((63 - $CLEN)))")"
            printf '#define UTS_RELEASE "%s"\n' "$PADUTS" > "$KDIR_RESOLVED/include/generated/utsrelease.h"
            printf '%s' "$PADUTS" > "$KDIR_RESOLVED/include/config/kernel.release"
          fi
          echo "baked UTS: $(cat "$KDIR_RESOLVED/include/generated/utsrelease.h")"
          cd kmod
          export PATH="$(echo /opt/ddk/clang/*/bin | cut -d' ' -f1):$PATH"
          make KDIR="$KDIR_RESOLVED" KMI="${{ matrix.kmi }}" ${{ matrix.dbg == true && 'DBG=1' || '' }}
          OBJCOPY_BIN=$(cat "$GITHUB_WORKSPACE/.objcopy")
          [ -n "$OBJCOPY_BIN" ] || { echo "FATAL: no objcopy"; exit 1; }
          if [ "${{ matrix.dbg }}" != "true" ]; then
            "$OBJCOPY_BIN" --strip-debug rwbridge.ko
          else
            echo "dbg variant: keeping debug info (no --strip-debug)"
          fi
          if [ "${{ matrix.dbg }}" != "true" ]; then
            "$OBJCOPY_BIN" --remove-section __versions rwbridge.ko
          else
            # debug_info holds relocations against __versions, so the
            # section cannot be removed — zero it in place instead (the
            # gate accepts empty __versions as CRC-free).
            : > empty_versions.bin
            "$OBJCOPY_BIN" --update-section __versions=empty_versions.bin rwbridge.ko
            echo "dbg variant: __versions zeroed in place (debug relocations kept)"
          fi
          echo "stripped __versions (enforcing loaders warn-and-pass CRC-less)"
          echo "OBJCOPY_BIN=$OBJCOPY_BIN" >> "$GITHUB_ENV"
          # NOTE: DBG=1 must reach the gate too — check-universal depends
          # on `all`, and kbuild would otherwise silently rebuild the
          # objects WITHOUT -g and ship a non-debug "dbg" artifact.
          # Tee the build: modpost WARNS (not errors) on namespaced
          # symbols used without MODULE_IMPORT_NS, but the LOADER
          # rejects them (EINVAL) — fail here instead.
          # pipefail: tee must not mask a make failure.
          set -o pipefail
          make KDIR="$KDIR_RESOLVED" KMI="${{ matrix.kmi }}" ${{ matrix.dbg == true && 'DBG=1' || '' }} NM="$NM_BIN" OBJDUMP="$OBJDUMP_BIN" check-universal 2>&1 | tee build.log
          if grep -qiE "does not import it|namespace.*mismatch" build.log; then
            echo "FAIL: namespaced symbol used without MODULE_IMPORT_NS (loader would reject)"
            exit 1
          fi

          mv rwbridge.ko "rwbridge-${{ matrix.kmi }}.ko"
          if [ "${{ matrix.dbg }}" != "true" ]; then
            command -v llvm-strip >/dev/null 2>&1 && llvm-strip -g "rwbridge-${{ matrix.kmi }}.ko" || true
          else
            echo "dbg variant: skipping llvm-strip (forensics build)"
          fi
          ls -la "rwbridge-${{ matrix.kmi }}.ko"
      - name: Upload build artifact (internal, consumed by pack job)
        uses: actions/upload-artifact@v4
        with:
          name: _build-${{ matrix.kmi }}
          path: |
            kmod/rwbridge-${{ matrix.kmi }}.ko
            run.sh

  pack:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout (spx.c source)
        uses: actions/checkout@v4

      - name: Fetch build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: _build-*
          path: dl
          merge-multiple: true

      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu file

      - name: Build finit-force helper (run.sh last-resort loader)
        run: |
          # -static-pie (NOT -static: non-PIE aborts on Android 12+).
          aarch64-linux-gnu-gcc -static-pie -O2 -Wall -o finit-force kmod/finit-force.c
          file finit-force
          cp finit-force dl/kmod/finit-force
          ls -la dl/kmod/finit-force

      - name: Generate blobs + build packed binary
        run: |
          ls dl/kmod/ 2>/dev/null || ls dl/ 2>/dev/null
          python3 - \
            dl/kmod/rwbridge-universal.ko \
            dl/kmod/rwbridge-android12-5.10.ko \
            dl/kmod/rwbridge-android13-5.10.ko \
            dl/kmod/rwbridge-android13-5.15.ko \
            dl/kmod/rwbridge-android14-5.15.ko \
            dl/kmod/rwbridge-android14-6.1.ko \
            dl/kmod/rwbridge-android14-6.1-dbg.ko \
            dl/kmod/rwbridge-android15-6.6.ko \
            dl/kmod/rwbridge-android16-6.12.ko \
            run.sh blobs.c <<'PYEOF'
          import sys
          def emit(name, path):
              d = open(path, 'rb').read()
              # C symbol hygiene: dots/dashes cannot appear in identifiers
              sym = name.replace('.', '_').replace('-', '_')
              L = ['const unsigned char %s_start[] = {' % sym]
              L.append(','.join(str(b) for b in d))
              L.append('};')
              L.append('const unsigned long %s_len = %d;' % (sym, len(d)))
              return '\n'.join(L)
          *kos, sh, out = sys.argv[1:]
          assert len(kos) == 9, "need 8 KMI artifacts + universal, got %d" % len(kos)
          short = {'universal': 'universal',
                   'android12-5.10': 'a12_5_10', 'android13-5.10': 'a13_5_10',
                   'android13-5.15': 'a13_5_15', 'android14-5.15': 'a14_5_15',
                    'android14-6.1': 'a14_6_1', 'android14-6.1-dbg': 'a14_6_1_dbg',
                   'android15-6.6': 'a15_6_6', 'android16-6.12': 'a16_6_12'}
          parts = [emit('_binary_rwbridge_' + short[k.split('rwbridge-')[1].rsplit('.ko', 1)[0]] + '_ko', k)
                   for k in kos]
          parts.append(emit('_binary_runsh', sh))
          open(out, 'w').write('\n'.join(parts) + '\n')
          print('blobs written: universal + 8 artifacts + run.sh')
          PYEOF
          grep -c "_binary_rwbridge_.*_start" blobs.c
          aarch64-linux-gnu-gcc -static-pie -O2 -Wall -o rwbridge-spx kmod/spx.c blobs.c
          file rwbridge-spx
          ls -la rwbridge-spx

      - name: Upload product (sole deliverable)
        uses: actions/upload-artifact@v4
        with:
          name: rwbridge-spx
          path: rwbridge-spx

      - name: Upload shell bundle (SPX fallback path)
        uses: actions/upload-artifact@v4
        with:
          name: shell-bundle
          path: |
            dl/kmod/rwbridge-*.ko
            dl/kmod/finit-force
            run.sh
