name: build-matrix-kmod

# rwbridge is built once PER KMI GENERATION (8 DDK targets). Each artifact
# matches its own generation's headers/layouts; vendor variance inside a
# generation (UTS suffixes) is absorbed at install by the vermagic
# placeholder + run.sh/SPX patch. The single deliverable stays ONE packed
# binary (rwbridge-spx, all 8 artifacts inside) + one shell bundle.
#
# DDK provides containerized kernel trees per KMI (no source on any
# device, never in this repo). ddk_release is pinned; bumping it is a
# deliberate, reviewed change (new compiler/headers alter every artifact).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.img }}-20251016
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - kmi: android12-5.10
            img: android12-5.10
          - kmi: android13-5.10
            img: android13-5.10
          - kmi: android13-5.15
            img: android13-5.15
          - kmi: android14-5.15
            img: android14-5.15
          - kmi: android14-6.1
            img: android14-6.1
          - kmi: android14-6.1-cfi
            img: android14-6.1
            cf: true
          - kmi: android15-6.6
            img: android15-6.6
          - kmi: android16-6.12
            img: android16-6.12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve DDK tree + toolchain
        run: |
          # DDK layout: /opt/ddk/kdir/<kmi> + clang under /opt/ddk/clang.
          # KERNEL_SRC is NOT an image env (wuwa sets it manually) — resolve
          # here, loud on miss. Strip our -cfi variant suffix for the tree.
          IMG="${{ matrix.img }}"
          for cand in "/opt/ddk/kdir/$IMG" /opt/ddk/kdir/*${IMG%%-*}* ; do
            if [ -d "$cand" ]; then KDIR_CAND="$cand"; break; fi
          done
          [ -n "$KDIR_CAND" ] || KDIR_CAND="/opt/ddk/kdir/$IMG"
          [ -d "$KDIR_CAND" ] || { echo "FATAL: no kdir for $IMG"; ls /opt/ddk/kdir/ 2>/dev/null; exit 1; }
          echo "KDIR_RESOLVED=$KDIR_CAND" >> "$GITHUB_ENV"
          for cd in /opt/ddk/clang/*/bin; do
            [ -d "$cd" ] && echo "$cd" >> /tmp/clangpaths
          done
          CLANG_BIN=$(head -1 /tmp/clangpaths 2>/dev/null || true)
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "kdir=$KDIR_CAND clang=$CLANG_BIN"
          # nm/objdump for the gate: LLVM first, GNU cross, host last.
          for t in llvm-nm aarch64-linux-gnu-nm nm; do
            command -v $t >/dev/null 2>&1 && { echo "NM_BIN=$t" >> "$GITHUB_ENV"; break; }
          done
          for t in llvm-objdump aarch64-linux-gnu-objdump objdump; do
            command -v $t >/dev/null 2>&1 && { echo "OBJDUMP_BIN=$t" >> "$GITHUB_ENV"; break; }
          done

      - name: Build module for ${{ matrix.kmi }}
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: 1
          LLVM_IAS: 1
        run: |
          echo "=== KMI: ${{ matrix.kmi }} ==="
          # CRCs pin a build past its KMI (runtime vermagic patch cannot
          # fix them): force MODVERSIONS off in the donor tree, re-prepare.
          (cd "$KDIR_RESOLVED" && ./scripts/config --disable MODVERSIONS)
          (cd "$KDIR_RESOLVED" && make olddefconfig >/dev/null 2>&1)
          grep -q "# CONFIG_MODVERSIONS is not set" "$KDIR_RESOLVED/.config" \
            || { echo "FATAL: MODVERSIONS still on"; exit 1; }
          (cd "$KDIR_RESOLVED" && make modules_prepare >/dev/null 2>&1)
          BASEUTS=$(cd "$KDIR_RESOLVED" && make -s kernelrelease 2>/dev/null || echo "0.0.0")
          echo "donor UTS: $BASEUTS"
          # Pad EXTRAVERSION so baked UTS reaches the 63-char cap: every
          # real target vermagic then fits the in-place runtime patch
          # (patch only ever shrinks; kbuild fails past 64, loud).
          BLEN=${#BASEUTS}
          if [ "$BLEN" -lt 63 ]; then
            PAD=$(python3 -c "print('x'*$((63 - $BLEN)))")
          else
            PAD=""
          fi
          cd kmod
          if [ "${{ matrix.cf }}" = "true" ]; then
            sudo apt-get update && sudo apt-get install -y clang lld llvm
          fi
          export PATH="$CLANG_BIN:$PATH"
          make KDIR="$KDIR_RESOLVED" KMI="${{ matrix.kmi }}" EXTRAVERSION="-${PAD}" ${{ matrix.cf == true && 'CFI=1 CC="clang --target=aarch64-linux-gnu -fintegrated-as"' || '' }}

      - name: Per-target gate (imports, BTI, placeholder)
        run: |
          cd kmod
          make KDIR="$KDIR_RESOLVED" KMI="${{ matrix.kmi }}" NM="$NM_BIN" OBJDUMP="$OBJDUMP_BIN" check-universal
          if [ "${{ matrix.cf }}" = "true" ]; then
            N=$(llvm-objdump -d "rwbridge.ko" | grep -c "brk.*0x8228"); echo "kcfi traps: $N"; [ "$N" -gt 0 ]
          fi

      - name: Rename per KMI + strip
        run: |
          cd kmod
          mv rwbridge.ko "rwbridge-${{ matrix.kmi }}.ko"
          llvm-strip -d "rwbridge-${{ matrix.kmi }}.ko" || true
          ls -la "rwbridge-${{ matrix.kmi }}.ko"

      - name: Upload build artifact (internal, consumed by pack job)
        uses: actions/upload-artifact@v4
        with:
          name: _build-${{ matrix.kmi }}
          path: |
            kmod/rwbridge-${{ matrix.kmi }}.ko
            run.sh

  pack:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout (spx.c source)
        uses: actions/checkout@v4

      - name: Fetch build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: _build-*
          path: dl
          merge-multiple: true

      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu file

      - name: Generate blobs + build packed binary
        run: |
          ls dl/kmod/ 2>/dev/null || ls dl/ 2>/dev/null
          python3 - \
            dl/kmod/rwbridge-android12-5.10.ko \
            dl/kmod/rwbridge-android13-5.10.ko \
            dl/kmod/rwbridge-android13-5.15.ko \
            dl/kmod/rwbridge-android14-5.15.ko \
            dl/kmod/rwbridge-android14-6.1.ko \
            dl/kmod/rwbridge-android14-6.1-cfi.ko \
            dl/kmod/rwbridge-android15-6.6.ko \
            dl/kmod/rwbridge-android16-6.12.ko \
            run.sh blobs.c <<'PYEOF'
          import sys
          def emit(name, path):
              d = open(path, 'rb').read()
              # C symbol hygiene: dots/dashes cannot appear in identifiers
              sym = name.replace('.', '_').replace('-', '_')
              L = ['const unsigned char %s_start[] = {' % sym]
              L.append(','.join(str(b) for b in d))
              L.append('};')
              L.append('const unsigned long %s_len = %d;' % (sym, len(d)))
              return '\n'.join(L)
          *kos, sh, out = sys.argv[1:]
          assert len(kos) == 8, "need exactly 8 KMI artifacts, got %d" % len(kos)
          parts = [emit('_binary_rwbridge_' + k.split('rwbridge-')[1].rsplit('.ko', 1)[0], k)
                   for k in kos]
          parts.append(emit('_binary_runsh', sh))
          open(out, 'w').write('\n'.join(parts) + '\n')
          print('blobs written: 8 artifacts + run.sh')
          PYEOF
          grep -c "_binary_rwbridge_.*_start" blobs.c
          aarch64-linux-gnu-gcc -static-pie -O2 -Wall -o rwbridge-spx kmod/spx.c blobs.c
          file rwbridge-spx
          ls -la rwbridge-spx

      - name: Upload product (sole deliverable)
        uses: actions/upload-artifact@v4
        with:
          name: rwbridge-spx
          path: rwbridge-spx

      - name: Upload shell bundle (SPX fallback path)
        uses: actions/upload-artifact@v4
        with:
          name: shell-bundle
          path: |
            dl/kmod/rwbridge-*.ko
            run.sh
