name: build-matrix-kmod

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly rebuild to catch new DDK tags

jobs:
  generate-matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build matrix
        id: generate
        run: |
          python3 .github/scripts/generate_matrix.py --fetch-latest --output matrix.json
          echo "matrix=$(cat matrix.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.kmi }}
    needs: generate-matrix
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.ddk_tag }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve + build + gate ${{ matrix.kmi }}
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: 1
          LLVM_IAS: 1
        run: |
          echo "=== KMI: ${{ matrix.kmi }} (DDK: ${{ matrix.ddk_tag }}) ==="
          IMG="${{ matrix.img }}"
          KDIR_RESOLVED="${KERNEL_SRC:-/opt/ddk/kdir/$IMG}"
          [ -d "$KDIR_RESOLVED" ] || KDIR_RESOLVED="/opt/ddk/kdir/$IMG"
          [ -d "$KDIR_RESOLVED" ] || { echo "FATAL: no kdir for $IMG (KERNEL_SRC=$KERNEL_SRC)"; ls /opt/ddk/kdir/; exit 1; }
          echo "kdir=$KDIR_RESOLVED"
          ls "$KDIR_RESOLVED" | head -20
          
          if command -v pahole >/dev/null 2>&1 && [ -f "$KDIR_RESOLVED/vmlinux" ]; then
            echo "=== pahole task_struct ($IMG) ==="
            pahole -C task_struct "$KDIR_RESOLVED/vmlinux" 2>/dev/null | grep -E "mm;|comm\[|pid;|tgid;|cred;|real_parent;|prio;|thread;" | head -12
            echo "=== pahole mm_struct ($IMG) ==="
            pahole -C mm_struct "$KDIR_RESOLVED/vmlinux" 2>/dev/null | grep -E "pgd;|arg_start;|arg_end;|mmap;" | head -6
            echo "=== pahole vm_area_struct ($IMG) ==="
            pahole -C vm_area_struct "$KDIR_RESOLVED/vmlinux" 2>/dev/null | grep -E "vm_start;|vm_end;|vm_file;|vm_flags;" | head -6
            echo "=== pahole file_operations iterate ($IMG) ==="
            pahole -C file_operations "$KDIR_RESOLVED/vmlinux" 2>/dev/null | grep -E "iterate_shared;" | head -2
          else
            echo "pahole/vmlinux unavailable ($IMG)"
          fi
          
          {
            echo '#include <net/sock.h>';
            echo '#include <linux/net.h>';
            echo '#include <linux/fs.h>';
            echo '#include <linux/sched.h>';
            echo '#include <linux/mm.h>';
            echo '#include <linux/dcache.h>';
            echo '#include <linux/cred.h>';
            echo '#include <linux/utsname.h>';
            echo '#define X(p, s, m) __attribute__((used)) char _w_##p##_##m[(unsigned)__builtin_offsetof(s, m) + 1] = {0}';
            echo 'X(p, struct proto, obj_size); X(p, struct proto, slab); X(p, struct proto, name); X(p, struct proto, owner); X(p, struct proto, slab_flags); X(p, struct proto, max_header);';
            echo 'X(p, struct proto, useroffset); X(p, struct proto, usersize); X(p, struct proto, orphan_count); X(p, struct proto, rsk_prot); X(p, struct proto, twsk_prot); X(p, struct proto, node); X(p, struct proto, diag_destroy);';
            echo '#include <linux/version.h>';
            echo '#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)';
            echo 'X(p, struct proto, per_cpu_fw_alloc);';
            echo '#endif';
            echo 'X(o, struct proto_ops, release); X(o, struct proto_ops, mmap); X(o, struct proto_ops, accept); X(o, struct proto_ops, owner); X(o, struct proto_ops, family);';
            echo 'X(sk, struct sock, sk_callback_lock); X(sk, struct sock, sk_prot); X(sk, struct sock, sk_state);';
            echo 'X(so, struct socket, state); X(so, struct socket, type); X(so, struct socket, sk); X(so, struct socket, ops);';
            echo '#define SZ2(t) __attribute__((used)) char _w_sz2_##t[sizeof(t) + 1]';
            echo 'SZ2(struct sock); SZ2(struct socket);';
            echo 'X(f, struct net_proto_family, family); X(f, struct net_proto_family, create); X(f, struct net_proto_family, owner);';
            echo 'X(d, struct dir_context, actor); X(d, struct dir_context, pos);';
            echo 'X(u, struct new_utsname, sysname); X(u, struct new_utsname, nodename); X(u, struct new_utsname, release); X(u, struct new_utsname, machine);';
            echo 'X(t, struct task_struct, mm); X(t, struct task_struct, comm); X(t, struct task_struct, pid); X(t, struct task_struct, tgid); X(t, struct task_struct, cred); X(t, struct task_struct, real_parent); X(t, struct task_struct, prio);';
            echo 'X(c, struct cred, uid);';
            echo 'X(m, struct mm_struct, pgd); X(m, struct mm_struct, arg_start); X(m, struct mm_struct, arg_end); X(m, struct mm_struct, mmap);';
            echo 'X(v, struct vm_area_struct, vm_start); X(v, struct vm_area_struct, vm_end); X(v, struct vm_area_struct, vm_file); X(v, struct vm_area_struct, vm_flags); X(v, struct vm_area_struct, vm_next);';
            echo 'X(e, struct dentry, d_name);';
            echo 'X(fl, struct file, f_op); X(fl, struct file, f_path); X(fl, struct file, f_cred); X(fl, struct file, private_data); X(fl, struct file, f_count);';
            echo '#define SZ(t) __attribute__((used)) char _w_sz_##t[sizeof(t) + 1]';
            echo 'SZ(struct fown_struct); SZ(struct file_ra_state); SZ(rwlock_t); SZ(struct mutex);';
            echo 'X(fo, struct file_operations, iterate_shared); X(fo, struct file_operations, owner);';
            echo 'MODULE_LICENSE("GPL");';
          } > /tmp/memd_offexp-$IMG.c
          mkdir -p /tmp/expmod-$IMG && cp /tmp/memd_offexp-$IMG.c /tmp/expmod-$IMG/ && printf 'obj-m += memd_offexp.o\nCFLAGS_REMOVE_memd_offexp.o += -flto=thin -flto -flto=full -fsplit-lto-unit\nCFLAGS_memd_offexp.o += -fno-lto\n' > /tmp/expmod-$IMG/Makefile
          cat /tmp/expmod-$IMG/Makefile; ls /tmp/expmod-$IMG/; make -C "$KDIR_RESOLVED" M=/tmp/expmod-$IMG modules 2>&1 | tail -5; echo "MAKE-RC=$?"; ls -la /tmp/expmod-$IMG/ 2>&1 | head -8
          (NMX=""; for t in llvm-nm aarch64-linux-gnu-nm nm; do command -v $t >/dev/null 2>&1 && { NMX=$t; break; }; done; \
           echo "NM=$NMX"; $NMX /tmp/expmod-$IMG/memd_offexp.o 2>&1 | grep -iE "_w_|no symbols" | head -35) || \
            echo "offexp kbuild unavailable"
          rm -rf /tmp/expmod-$IMG /tmp/memd_offexp-$IMG.c
          
          for HDR in "/opt/ddk/src/$IMG" "$KDIR_RESOLVED"; do
            if [ -f "$HDR/include/net/sock.h" ]; then
              echo "=== FULL struct proto ($IMG) ==="
              awk '/^struct proto {/,/^};/' "$HDR/include/net/sock.h"
              echo "=== FULL struct proto_ops ($IMG) ==="
              awk '/^struct proto_ops {/,/^};/' "$HDR/include/linux/net.h"
              echo "=== struct new_utsname ($IMG) ==="
              grep -n -A12 "struct new_utsname" "$HDR/include/uapi/linux/utsname.h" | head -16
              echo "=== arch_rwlock_t ($IMG) ==="
              grep -rn -B2 -A6 "} arch_rwlock_t;" "$HDR/arch/arm64/include/asm/" "$HDR/include/asm-generic/" 2>/dev/null | head -14 || echo "no rwlock def found"
              echo "=== FULL struct net_proto_family ($IMG) ==="
              awk '/^struct net_proto_family {/,/^};/' "$HDR/include/linux/net.h"
              echo "=== FULL struct dir_context ($IMG) ==="
              awk '/^struct dir_context {/,/^};/' "$HDR/include/linux/fs.h"
              echo "=== FULL struct task_struct ($IMG) ==="
              awk '/^struct task_struct {/,/^};/' "$HDR/include/linux/sched.h"
              echo "=== FULL struct mm_struct ($IMG) ==="
              awk '/^struct mm_struct {/,/^};/' "$HDR/include/linux/mm_types.h"
              echo "=== FULL struct vm_area_struct ($IMG) ==="
              awk '/^struct vm_area_struct {/,/^};/' "$HDR/include/linux/mm_types.h"
              echo "=== FULL struct dentry ($IMG) ==="
              awk '/^struct dentry {/,/^};/' "$HDR/include/linux/dcache.h"
              echo "=== FULL struct file ($IMG) ==="
              awk '/^struct file {/,/^};/' "$HDR/include/linux/fs.h"
              echo "=== FULL struct thread_struct ($IMG) ==="
              awk '/^struct thread_struct {/,/^};/' "$HDR/arch/arm64/include/asm/processor.h"
              echo "=== FULL struct file_operations ($IMG) ==="
              awk '/^struct file_operations {/,/^};/' "$HDR/include/linux/fs.h"
              echo "=== FULL struct drm_minor ($IMG) ==="
              grep -rn -A20 "^struct drm_minor {" "$HDR/include/drm/" 2>/dev/null | head -24 || echo "no drm_minor in headers ($IMG)"
              echo "=== drm_client API declarations ($IMG) ==="
              grep -rn "drm_client_init\|drm_client_framebuffer_create\|drm_client_modeset_commit\|drm_client_release\|drm_client_buffer_vmap\|drm_client_buffer_vunmap" "$HDR/include/drm/" 2>/dev/null | grep -E "\(struct|int |void |struct drm" | head -12 || echo "no drm_client API in headers ($IMG)"
              echo "=== FULL struct socket ($IMG) ==="
              awk '/^struct socket {/,/^};/' "$HDR/include/linux/net.h"
              echo "=== FULL struct sock ($IMG) ==="
              awk '/^struct sock {/,/^};/' "$HDR/include/net/sock.h"
              echo "=== FULL struct thread_struct ($IMG) ==="
              awk '/^struct thread_struct {/,/^};/' "$HDR/arch/arm64/include/asm/processor.h"
              echo "=== struct task_struct head ($IMG) ==="
              grep -n "struct mm_struct\s*\*mm;\|char comm\[TASK_COMM_LEN\]\|pid_t pid;\|pid_t tgid;\|const struct cred __rcu \*cred;\|struct task_struct __rcu \*real_parent;\|int prio;" "$HDR/include/linux/sched.h" | head -10
              echo "=== mm_struct fields ($IMG) ==="
              grep -n "pgd_t \*pgd;\|unsigned long arg_start;\|unsigned long arg_end;\|struct vm_area_struct \*mmap;" "$HDR/include/linux/mm_types.h" | head -8
              echo "=== vm_area_struct fields ($IMG) ==="
              grep -n "unsigned long vm_start;\|unsigned long vm_end;\|struct file \*vm_file;\|unsigned long vm_flags;\|struct vm_area_struct \*vm_next;" "$HDR/include/linux/mm_types.h" | head -8
              echo "=== dentry/file/fileops fields ($IMG) ==="
              grep -n "struct qstr d_name;" "$HDR/include/linux/dcache.h" | head -2
              grep -n "const struct file_operations\s*\*f_op;\|struct path\s*f_path;" "$HDR/include/linux/fs.h" | head -4
              grep -n "iterate_shared;" "$HDR/include/linux/fs.h" | head -3
              echo "=== fs_struct def header ($IMG) ==="
              grep -rln "^struct fs_struct {" "$HDR/include/" 2>/dev/null | head -3 || echo "fs_struct def not found ($IMG)"
              echo "=== struct files_struct ($IMG) ==="
              grep -rn -A22 "^struct files_struct {" "$HDR/include/linux/" 2>/dev/null | head -28 || echo "files_struct not found ($IMG)"
              echo "=== struct fdtable ($IMG) ==="
              grep -rn -A12 "^struct fdtable {" "$HDR/include/linux/" 2>/dev/null | head -16 || echo "fdtable not found ($IMG)"
              break
            fi
          done
          
          NM_BIN=""; for t in llvm-nm aarch64-linux-gnu-nm nm; do command -v $t >/dev/null 2>&1 && { NM_BIN=$t; break; }; done
          OBJCOPY_BIN=""; for t in llvm-objcopy aarch64-linux-gnu-objcopy objcopy; do command -v $t >/dev/null 2>&1 && { OBJCOPY_BIN=$t; break; }; done
          echo "$OBJCOPY_BIN" > "$GITHUB_WORKSPACE/.objcopy"
          OBJDUMP_BIN=""; for t in llvm-objdump aarch64-linux-gnu-objdump objdump; do command -v $t >/dev/null 2>&1 && { OBJDUMP_BIN=$t; break; }; done
          echo "tools: NM=$NM_BIN OBJDUMP=$OBJDUMP_BIN"
          [ -n "$NM_BIN" ] && [ -n "$OBJDUMP_BIN" ] || { echo "FATAL: no nm/objdump"; exit 1; }
          export PATH="$(echo /opt/ddk/clang/*/bin | cut -d' ' -f1):$PATH"
          
          BASEUTS=$(cd "$KDIR_RESOLVED" && make -s kernelrelease 2>/dev/null || echo "0.0.0")
          echo "donor UTS: $BASEUTS"
          rm -f "$KDIR_RESOLVED/localversion-memd"
          BLEN=${#BASEUTS}
          if [ "$BLEN" -lt 63 ]; then
            python3 -c "open('$KDIR_RESOLVED/localversion-memd','w').write('x'*$((63 - $BLEN)))"
          fi
          echo "padded UTS: $(cd "$KDIR_RESOLVED" && make -s kernelrelease 2>/dev/null)"
          
          CURUTS=$(grep -o '"[^"]*"' "$KDIR_RESOLVED/include/generated/utsrelease.h" | head -1 | tr -d '"')
          CLEN=${#CURUTS}
          if [ "$CLEN" -ge 63 ]; then echo "UTS already roomy: $CURUTS"; else
            PADUTS="${CURUTS}$(python3 -c "print('x'*$((63 - $CLEN)))")"
            printf '#define UTS_RELEASE "%s"\n' "$PADUTS" > "$KDIR_RESOLVED/include/generated/utsrelease.h"
            printf '%s' "$PADUTS" > "$KDIR_RESOLVED/include/config/kernel.release"
          fi
          echo "baked UTS: $(cat "$KDIR_RESOLVED/include/generated/utsrelease.h")"
          
          cd kmod
          export PATH="$(echo /opt/ddk/clang/*/bin | cut -d' ' -f1):$PATH"
          make KDIR="$KDIR_RESOLVED" KMI="${{ matrix.kmi }}" ${{ matrix.dbg == true && 'DBG=1' || '' }} ${{ matrix.test == true && 'DISP_TEST=1' || '' }}
          OBJCOPY_BIN=$(cat "$GITHUB_WORKSPACE/.objcopy")
          [ -n "$OBJCOPY_BIN" ] || { echo "FATAL: no objcopy"; exit 1; }
          if [ "${{ matrix.dbg }}" != "true" ]; then
            "$OBJCOPY_BIN" --strip-debug rwbridge.ko
          else
            echo "dbg variant: keeping debug info (no --strip-debug)"
          fi
          if [ "${{ matrix.dbg }}" != "true" ]; then
            "$OBJCOPY_BIN" --remove-section __versions rwbridge.ko
          else
            : > empty_versions.bin
            "$OBJCOPY_BIN" --update-section __versions=empty_versions.bin rwbridge.ko
            echo "dbg variant: __versions zeroed in place (debug relocations kept)"
          fi
          echo "stripped __versions (enforcing loaders warn-and-pass CRC-less)"
          echo "OBJCOPY_BIN=$OBJCOPY_BIN" >> "$GITHUB_ENV"
          
          set -o pipefail
          make KDIR="$KDIR_RESOLVED" KMI="${{ matrix.kmi }}" ${{ matrix.dbg == true && 'DBG=1' || '' }} ${{ matrix.test == true && 'DISP_TEST=1' || '' }} NM="$NM_BIN" OBJDUMP="$OBJDUMP_BIN" check-universal 2>&1 | tee build.log
          if grep -qiE "does not import it|namespace.*mismatch" build.log; then
            echo "FAIL: namespaced symbol used without MODULE_IMPORT_NS (loader would reject)"
            exit 1
          fi

          mv rwbridge.ko "rwbridge-${{ matrix.kmi }}.ko"
          if [ "${{ matrix.dbg }}" != "true" ]; then
            command -v llvm-strip >/dev/null 2>&1 && llvm-strip -g "rwbridge-${{ matrix.kmi }}.ko" || true
          else
            echo "dbg variant: skipping llvm-strip (forensics build)"
          fi
          ls -la "rwbridge-${{ matrix.kmi }}.ko"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: _build-${{ matrix.kmi }}
          path: |
            kmod/rwbridge-${{ matrix.kmi }}.ko
            run.sh

  pack:
    name: Pack SPX Binary
    needs: [generate-matrix, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: _build-*
          path: dl
          merge-multiple: true

      - name: Install cross linker + lz4
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu file lz4

      - name: Build finit-force helper + spx_decompress
        run: |
          aarch64-linux-gnu-gcc -static-pie -O2 -Wall -o finit-force kmod/finit-force.c
          aarch64-linux-gnu-gcc -static-pie -O2 -Wall -o spx_decompress kmod/spx_decompress.c
          file finit-force
          file spx_decompress
          cp finit-force dl/kmod/finit-force
          cp spx_decompress dl/kmod/spx_decompress
          ls -la dl/kmod/finit-force dl/kmod/spx_decompress

      - name: Generate blobs + build packed binary
        env:
          MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
        run: |
          ls dl/kmod/ 2>/dev/null || ls dl/ 2>/dev/null
          
          # Generate dynamic list of KOs from matrix
          python3 .github/scripts/gen_ko_list.py
          KO_LIST=$(cat /tmp/ko_list.txt)
          
          python3 .github/scripts/gen_blobs.py \
            $KO_LIST \
            run.sh blobs.c
          
          # Compress final SPX binary with LZ4 (90%+ compression)
          lz4 -9 rwbridge-spx rwbridge-spx.lz4
          echo "Original: $(wc -c < rwbridge-spx) bytes"
          echo "Compressed: $(wc -c < rwbridge-spx.lz4) bytes"
          ratio=$(python3 -c "import sys; o=int(sys.argv[1]); c=int(sys.argv[2]); print(f'{100 - c*100//o}%')" $(wc -c < rwbridge-spx) $(wc -c < rwbridge-spx.lz4))
          echo "Compression ratio: $ratio"
          
          file rwbridge-spx
          ls -la rwbridge-spx rwbridge-spx.lz4

      - name: Upload product (sole deliverable)
        uses: actions/upload-artifact@v4
        with:
          name: rwbridge-spx
          path: |
            rwbridge-spx
            rwbridge-spx.lz4

      - name: Upload shell bundle
        uses: actions/upload-artifact@v4
        with:
          name: shell-bundle
          path: |
            dl/kmod/rwbridge-*.ko
            dl/kmod/finit-force
            dl/kmod/spx_decompress
            run.sh

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rwbridge-${{ github.run_number }}
          name: rwbridge build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            rwbridge-spx
            rwbridge-spx.lz4
            dl/kmod/spx_decompress
            shell-bundle/*
          generate_release_notes: true