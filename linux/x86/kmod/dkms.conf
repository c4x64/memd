# DKMS configuration for rwbridge (memd-derived driver).
#
# Multi-backend build support:
#   Backend 1 - standard headers: full kernel headers package.
#   Backend 2 - BTF + vmlinux.h: generated from /sys/kernel/btf/vmlinux.
#   Backend 3 - kbuild-only: /lib/modules/$(uname -r)/build tree.
#   Backend 4 - proot/Termux cross-compile fallback.
#
# Auto-selection happens in build-on-device.sh; DKMS invokes that script
# when present, otherwise falls back to a throttled standard kbuild.
#
# CPU throttling: nice -n 19 and -j2 (low-power safe).

PACKAGE_NAME="rwbridge"
PACKAGE_VERSION="1.0"

# Source is expected to contain the full kmod tree (Makefile + sources).
# DKMS copies this tree into ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build.

# Clean target: prefer kbuild clean, then remove stray artifacts.
CLEAN="make clean KDIR=/lib/modules/${kernelver}/build 2>/dev/null || true; rm -rf .tmp_versions *.o *.ko *.mod *.mod.c *.mod.o .*.cmd"

# Primary build command with multi-backend auto-selection.
# When build-on-device.sh is present in the source tree it handles backend
# detection, throttling, and verification. Otherwise we run a throttled
# standard kbuild against the running kernel's build tree.
MAKE[0]="sh -c 'set -e; if [ -f ./build-on-device.sh ]; then sh ./build-on-device.sh --dkms --auto --kver ${kernelver} --jobs 2; else nice -n 19 make -j2 -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules; fi'"

# Secondary safety build (kbuild-only) used only if primary is skipped.
MAKE[1]="sh -c 'if [ ! -f rwbridge.ko ]; then nice -n 19 make -j2 -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules; fi'"

# Module metadata.
BUILT_MODULE_NAME[0]="rwbridge"
DEST_MODULE_LOCATION[0]="/kernel/drivers/misc"
DEST_MODULE_NAME[0]="rwbridge"

# Automatically install on kernel upgrade.
AUTOINSTALL="yes"
REMAKE_INITRD="no"

# Build dependencies (informational; DKMS will warn if missing).
BUILD_DEPENDS[0]="make gcc"
# Optional tooling for advanced backends:
#   bpftool (BTF backend), clang (proot/Termux backend).

# Post-build hook: verify the artifact exists.
POST_BUILD="sh -c 'if [ ! -f rwbridge.ko ]; then echo \"rwbridge.ko missing after build\" >&2; exit 1; fi; echo \"rwbridge.ko built successfully\"'"

# Pre-build hook: ensure throttling environment is documented.
PRE_BUILD="sh -c 'echo \"[rwbridge] DKMS build start: kernel=${kernelver} (throttled)\"'"

# DKMS behavior knobs.
# Do not strip debug info by default for diagnostics on failure.
STRIP[0]="no"
# Keep module signing disabled unless the kernel requires it.
SIGN_TOOL=""

# Supported architectures.
# rwbridge targets arm64 primarily; x86_64 allowed for host testing.
# (DKMS filters by ARCH automatically when set.)
# ARCH="arm64"

# Version magic handling: rwbridge uses a vermagic placeholder patched at
# install time by run.sh / fix-versions; DKMS default vermagic is acceptable
# for same-KMI installs.

# Module parameters (none exported by default).
# MODULE_PARAMS=""

# Notes for operators:
# - On Android devices without /lib/modules/${kernelver}/build, use
#   build-on-device.sh which auto-tries BTF and proot/Termux backends.
# - CPU throttling (nice -n 19, -j2) is mandatory on low-power devices.
# - For BTF backend, install bpftool and ensure /sys/kernel/btf/vmlinux.
# - For proot/Termux backend, install a cross toolchain (clang/gcc).
