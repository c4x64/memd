name: build-kmod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── The 6 fixed stock KMI builds ────────────────────────────────────────
  # One .ko per GKI kernel major. rwbridge.c resolves all struct offsets and
  # the VA geometry from THIS kernel's own headers at build time (offsetof(),
  # PAGE_OFFSET/TASK_SIZE, pgtable shifts), so each build is correct for its
  # kernel with no offsets file. Vermagic encodes the full release (w.x.y),
  # so a .ko only loads on a kernel with an exact vermagic match.
  kmod:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - kver: "5.10.209"
          tag: "5.10"
        - kver: "5.15.137"
          tag: "5.15"
        - kver: "6.1.90"
          tag: "6.1"
        - kver: "6.6.50"
          tag: "6.6"
        - kver: "6.12.20"
          tag: "6.12"
        - kver: "6.18"            # pin to a stable 6.18.y patch before enabling
          tag: "6.18"
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KVER: ${{ matrix.kver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev bison flex

      - name: Fetch & extract kernel source
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-$KVER.tar.xz || \
            wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz || \
            { echo "no tarball for $KVER"; exit 1; }
          tar xf linux-$KVER.tar.xz

      - name: Configure kernel to match target vermagic
        run: |
          cd linux-$KVER
          make ARCH=$ARCH defconfig
          scripts/config --disable LOCALVERSION_AUTO
          scripts/config --set-str LOCALVERSION ""
          scripts/config --enable MODULES
          scripts/config --enable MODULE_UNLOAD
          scripts/config --enable MODVERSIONS
          scripts/config --enable SMP
          scripts/config --enable PREEMPT
          make ARCH=$ARCH olddefconfig
          # Build vmlinux so modpost emits the real EXPORT_SYMBOL CRCs for
          # this exact kernel+config (vmlinux.symvers on 5.10, Module.symvers
          # on 5.15+; normalize to Module.symvers).
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE -j$(nproc) vmlinux
          [ ! -f Module.symvers ] && [ -f vmlinux.symvers ] && cp vmlinux.symvers Module.symvers
          # vmlinux alone does not generate scripts/module.lds (only
          # modules_prepare/scripts do), needed for the external kmod link.
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE prepare modules_prepare scripts
          ls -la Module.symvers
          head -5 Module.symvers

      - name: Build kmod
        run: |
          cd kmod
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE KDIR="$GITHUB_WORKSPACE/linux-$KVER"

      - name: Show vermagic
        run: |
          modinfo kmod/rwbridge.ko || \
          aarch64-linux-gnu-objcopy -O binary --only-section=.modinfo \
            kmod/rwbridge.ko /dev/stdout | strings | grep -i vermagic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rwbridge-${{ matrix.kver }}
          path: kmod/rwbridge.ko

  # ── The 7th build: the API 36 emulator's GKI kernel (ranchu) ───────────
  # The BlueStacks vendored build was removed (no longer a target). In its
  # place this job builds rwbridge.ko for the Android Studio arm64 emulator,
  # which runs the GKI kernel
  #    6.6.66-android15-8-4k-Wild     (vermagic: "6.6.66-android15-8-4k-Wild
  #     SMP preempt mod_unload modversions aarch64")
  # WildKernels builds of this image are clang/CFI, and the running kernel
  # exposes its EXACT build config via /proc/config.gz. That config is
  # committed as kmod/configs/ranchu-6.6.66-android15-8-4k-Wild.config and
  # reused here verbatim (minus the LOCALVERSION tweak), so struct module
  # size, symbol CRCs (modversions) and every offsetof() layout rwbridge.c
  # derives from the headers match the device byte-for-byte. 6 + 1 = 7 kos.
  kmod-ranchu:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      LLVM: 1
      KVER: 6.6.66
      KVER_FULL: 6.6.66-android15-8-4k-Wild
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            python3 cpio zip unzip git-lfs

      - name: Sparse-checkout prebuilt clang
        run: |
          git clone --depth 1 --branch android-platform-15.0.0_r17 \
            --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            /opt/clang
          cd /opt/clang
          git sparse-checkout set clang-r510928
          git lfs install && git lfs pull
          ls -la clang-r510928/bin/clang clang-r510928/bin/ld.lld

      - name: Checkout GKI kernel (android15-6.6 @ 6.6.66)
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: 9de961d64563bf935713301d350a242df59ae980
          path: android-kernel
          fetch-depth: 1

      - name: Configure kernel from device config
        run: |
          export PATH=/opt/clang/clang-r510928/bin:$PATH
          export ARCH=arm64 LLVM=1
          cp kmod/configs/ranchu-${{ env.KVER_FULL }}.config android-kernel/.config
          cd android-kernel
          scripts/config --disable LOCALVERSION_AUTO
          scripts/config --set-str LOCALVERSION "-android15-8-4k-Wild"
          # CFI_CLANG is on in the device config, so build with clang.
          make ARCH=$ARCH LLVM=1 olddefconfig
          grep -E '^CONFIG_(LOCALVERSION|CC_IS_CLANG|CFI_CLANG|SMP|PREEMPT|MODULE_UNLOAD|MODVERSIONS|THREAD_INFO_IN_TASK)' .config
          # Build vmlinux so modpost emits the real EXPORT_SYMBOL CRCs for
          # this exact kernel+config (Module.symvers), then prepare the tree
          # for the external kmod link.
          make ARCH=$ARCH LLVM=1 -j$(nproc) vmlinux
          make ARCH=$ARCH LLVM=1 prepare modules_prepare scripts
          ls -la Module.symvers
          head -5 Module.symvers

      - name: Build kmod
        run: |
          export PATH=/opt/clang/clang-r510928/bin:$PATH
          export ARCH=arm64 LLVM=1
          cd kmod
          make ARCH=$ARCH LLVM=1 KDIR="$GITHUB_WORKSPACE/android-kernel"

      - name: Show vermagic
        run: |
          export PATH=/opt/clang/clang-r510928/bin:$PATH
          modinfo kmod/rwbridge.ko 2>/dev/null || \
          llvm-objcopy -O binary --only-section=.modinfo \
            kmod/rwbridge.ko /dev/stdout | strings | grep -i vermagic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rwbridge-${{ env.KVER_FULL }}
          path: kmod/rwbridge.ko


