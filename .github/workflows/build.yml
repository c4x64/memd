name: build-matrix-kmod

# rwbridge is built once PER KMI GENERATION (8 DDK targets). Each artifact
# matches its own generation's headers/layouts; vendor variance inside a
# generation (UTS suffixes) is absorbed at install by the vermagic
# placeholder + run.sh/SPX patch. The single deliverable stays ONE packed
# binary (rwbridge-spx, all 8 artifacts inside) + one shell bundle.
#
# DDK provides containerized kernel trees per KMI (no source on any
# device, never in this repo). ddk_release is pinned; bumping it is a
# deliberate, reviewed change (new compiler/headers alter every artifact).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.img }}-20251016
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - kmi: android12-5.10
            img: android12-5.10
          - kmi: android13-5.10
            img: android13-5.10
          - kmi: android13-5.15
            img: android13-5.15
          - kmi: android14-5.15
            img: android14-5.15
          - kmi: android14-6.1
            img: android14-6.1
          - kmi: android14-6.1-cfi
            img: android14-6.1
            cf: true
          - kmi: android15-6.6
            img: android15-6.6
          - kmi: android16-6.12
            img: android16-6.12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve + build + gate ${{ matrix.kmi }}
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: 1
          LLVM_IAS: 1
        run: |
          echo "=== KMI: ${{ matrix.kmi }} ==="
          IMG="${{ matrix.img }}"
          KDIR_RESOLVED="${KERNEL_SRC:-/opt/ddk/kdir/$IMG}"
          [ -d "$KDIR_RESOLVED" ] || KDIR_RESOLVED="/opt/ddk/kdir/$IMG"
          [ -d "$KDIR_RESOLVED" ] || { echo "FATAL: no kdir for $IMG (KERNEL_SRC=$KERNEL_SRC)"; ls /opt/ddk/kdir/; exit 1; }
          echo "kdir=$KDIR_RESOLVED"
          ls "$KDIR_RESOLVED" | head -20
          NM_BIN=""; for t in llvm-nm aarch64-linux-gnu-nm nm; do command -v $t >/dev/null 2>&1 && { NM_BIN=$t; break; }; done
          OBJCOPY_BIN=""; for t in llvm-objcopy aarch64-linux-gnu-objcopy objcopy; do command -v $t >/dev/null 2>&1 && { OBJCOPY_BIN=$t; break; }; done
          echo "$OBJCOPY_BIN" > "$GITHUB_WORKSPACE/.objcopy"
          OBJDUMP_BIN=""; for t in llvm-objdump aarch64-linux-gnu-objdump objdump; do command -v $t >/dev/null 2>&1 && { OBJDUMP_BIN=$t; break; }; done
          echo "tools: NM=$NM_BIN OBJDUMP=$OBJDUMP_BIN"
          [ -n "$NM_BIN" ] && [ -n "$OBJDUMP_BIN" ] || { echo "FATAL: no nm/objdump"; exit 1; }
          export PATH="$(echo /opt/ddk/clang/*/bin | cut -d' ' -f1):$PATH"
          # No Kconfig tooling in DDK images (no scripts/config): CRCs are
          # stripped post-build instead (objcopy below). Enforcing loaders
          # warn-and-pass CRC-less modules; non-enforcing ignore them.
          BASEUTS=$(cd "$KDIR_RESOLVED" && make -s kernelrelease 2>/dev/null || echo "0.0.0")
          echo "donor UTS: $BASEUTS"
          # Pad via a localversion file (kbuild appends localversion* to
          # UTS; EXTRAVERSION overrides proved unreliable here). Target 63
          # total: every real vermagic then fits the in-place runtime patch
          # (patch only ever shrinks; kbuild fails past 64, loud).
          # Remove any stale memd pad first (idempotent reruns).
          rm -f "$KDIR_RESOLVED/localversion-memd"
          BLEN=${#BASEUTS}
          if [ "$BLEN" -lt 63 ]; then
            python3 -c "open('$KDIR_RESOLVED/localversion-memd','w').write('x'*$((63 - $BLEN)))"
          fi
          echo "padded UTS: $(cd "$KDIR_RESOLVED" && make -s kernelrelease 2>/dev/null)"
          if [ "${{ matrix.cf }}" = "true" ]; then
            sudo apt-get update && sudo apt-get install -y clang lld llvm
          fi
          cd kmod
          export PATH="$(echo /opt/ddk/clang/*/bin | cut -d' ' -f1):$PATH"
          make KDIR="$KDIR_RESOLVED" KMI="${{ matrix.kmi }}" ${{ matrix.cf == true && 'CFI=1 CC="clang --target=aarch64-linux-gnu -fintegrated-as"' || '' }}
          OBJCOPY_BIN=$(cat "$GITHUB_WORKSPACE/.objcopy")
          [ -n "$OBJCOPY_BIN" ] || { echo "FATAL: no objcopy"; exit 1; }
          "$OBJCOPY_BIN" --strip-debug rwbridge.ko
          "$OBJCOPY_BIN" --remove-section __versions rwbridge.ko
          echo "stripped debug + __versions (enforcing loaders warn-and-pass CRC-less)"
          echo "OBJCOPY_BIN=$OBJCOPY_BIN" >> "$GITHUB_ENV"${{ matrix.cf == true && 'CFI=1 CC="clang --target=aarch64-linux-gnu -fintegrated-as"' || '' }}
          make KDIR="$KDIR_RESOLVED" KMI="${{ matrix.kmi }}" NM="$NM_BIN" OBJDUMP="$OBJDUMP_BIN" check-universal
          if [ "${{ matrix.cf }}" = "true" ]; then
            N=$("$OBJDUMP_BIN" -d "rwbridge.ko" | grep -c "brk.*0x8228"); echo "kcfi traps: $N"; [ "$N" -gt 0 ]
          fi
          mv rwbridge.ko "rwbridge-${{ matrix.kmi }}.ko"
          command -v llvm-strip >/dev/null 2>&1 && llvm-strip -d "rwbridge-${{ matrix.kmi }}.ko" || true
          ls -la "rwbridge-${{ matrix.kmi }}.ko"
      - name: Upload build artifact (internal, consumed by pack job)
        uses: actions/upload-artifact@v4
        with:
          name: _build-${{ matrix.kmi }}
          path: |
            kmod/rwbridge-${{ matrix.kmi }}.ko
            run.sh

  pack:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout (spx.c source)
        uses: actions/checkout@v4

      - name: Fetch build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: _build-*
          path: dl
          merge-multiple: true

      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu file

      - name: Generate blobs + build packed binary
        run: |
          ls dl/kmod/ 2>/dev/null || ls dl/ 2>/dev/null
          python3 - \
            dl/kmod/rwbridge-android12-5.10.ko \
            dl/kmod/rwbridge-android13-5.10.ko \
            dl/kmod/rwbridge-android13-5.15.ko \
            dl/kmod/rwbridge-android14-5.15.ko \
            dl/kmod/rwbridge-android14-6.1.ko \
            dl/kmod/rwbridge-android14-6.1-cfi.ko \
            dl/kmod/rwbridge-android15-6.6.ko \
            dl/kmod/rwbridge-android16-6.12.ko \
            run.sh blobs.c <<'PYEOF'
          import sys
          def emit(name, path):
              d = open(path, 'rb').read()
              # C symbol hygiene: dots/dashes cannot appear in identifiers
              sym = name.replace('.', '_').replace('-', '_')
              L = ['const unsigned char %s_start[] = {' % sym]
              L.append(','.join(str(b) for b in d))
              L.append('};')
              L.append('const unsigned long %s_len = %d;' % (sym, len(d)))
              return '\n'.join(L)
          *kos, sh, out = sys.argv[1:]
          assert len(kos) == 8, "need exactly 8 KMI artifacts, got %d" % len(kos)
          parts = [emit('_binary_rwbridge_' + k.split('rwbridge-')[1].rsplit('.ko', 1)[0], k)
                   for k in kos]
          parts.append(emit('_binary_runsh', sh))
          open(out, 'w').write('\n'.join(parts) + '\n')
          print('blobs written: 8 artifacts + run.sh')
          PYEOF
          grep -c "_binary_rwbridge_.*_start" blobs.c
          aarch64-linux-gnu-gcc -static-pie -O2 -Wall -o rwbridge-spx kmod/spx.c blobs.c
          file rwbridge-spx
          ls -la rwbridge-spx

      - name: Upload product (sole deliverable)
        uses: actions/upload-artifact@v4
        with:
          name: rwbridge-spx
          path: rwbridge-spx

      - name: Upload shell bundle (SPX fallback path)
        uses: actions/upload-artifact@v4
        with:
          name: shell-bundle
          path: |
            dl/kmod/rwbridge-*.ko
            run.sh
