name: build memd

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  KERNEL_COMMON: https://android.googlesource.com/kernel/common

jobs:
  build-kmod:
    strategy:
      matrix:
        kernel:
          - name: gki-6.1-avd
            ref: android15-6.1
          - name: gki-5.10
            ref: android12-5.10
          - name: gki-5.15
            ref: android14-5.15
          - name: gki-6.1
            ref: android14-6.1
          - name: gki-6.6
            ref: android15-6.6
          - name: gki-6.12
            ref: android16-6.12
          - name: gki-6.18
            ref: android17-6.18
      fail-fast: false
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu clang lld llvm libelf-dev libdw-dev ccache

      - name: cache kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: kernel/${{ matrix.kernel.name }}
          key: kernel-src-${{ matrix.kernel.name }}-${{ matrix.kernel.ref }}

      - name: checkout kernel
        run: |
          if [ -d kernel/${{ matrix.kernel.name }}/include ]; then
            echo "kernel source already present (cache restore)"
            exit 0
          fi
          rm -rf kernel/${{ matrix.kernel.name }}
          git clone --depth=1 --branch ${{ matrix.kernel.ref }} \
            ${{ env.KERNEL_COMMON }} \
            kernel/${{ matrix.kernel.name }}

      - name: configure kernel
        run: |
          cd kernel/${{ matrix.kernel.name }}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: set build variables
        id: vars
        run: |
          echo "TOOLCHAIN=CROSS_COMPILE=aarch64-linux-gnu- CC='ccache aarch64-linux-gnu-gcc'" >> $GITHUB_OUTPUT

      - name: build kernel (avd only — generates Module.symvers)
        if: contains(matrix.kernel.name, 'avd')
        run: |
          cd kernel/${{ matrix.kernel.name }}
          make ARCH=arm64 ${{ steps.vars.outputs.TOOLCHAIN }} -j$(nproc) Image modules

      - name: prepare kernel (GKI only)
        if: ${{ !contains(matrix.kernel.name, 'avd') }}
        run: |
          cd kernel/${{ matrix.kernel.name }}
          make ARCH=arm64 ${{ steps.vars.outputs.TOOLCHAIN }} modules_prepare

      - name: build module
        run: |
          cd kernel/${{ matrix.kernel.name }}
          make ARCH=arm64 ${{ steps.vars.outputs.TOOLCHAIN }} \
            M=$GITHUB_WORKSPACE/module modules -j$(nproc) \
            KBUILD_MODPOST_WARN=1

      - name: sign modules (avd only)
        if: contains(matrix.kernel.name, 'avd')
        run: |
          cd kernel/${{ matrix.kernel.name }}
          for ko in $GITHUB_WORKSPACE/module/*.ko; do
            perl scripts/sign-file sha1 certs/signing_key.pem \
              certs/signing_key.x509 "$ko"
            echo "signed: $(basename $ko)"
          done

      - name: rename artifact
        run: |
          cp module/memd_kern.ko memd_kern-${{ matrix.kernel.name }}.ko

      - uses: actions/upload-artifact@v4
        with:
          name: memd_kern-${{ matrix.kernel.name }}
          path: memd_kern-${{ matrix.kernel.name }}.ko

      - name: upload kernel image (avd only)
        if: contains(matrix.kernel.name, 'avd')
        run: |
          cp arch/arm64/boot/Image kernel-Image-${{ matrix.kernel.name }}
        working-directory: kernel/${{ matrix.kernel.name }}

      - uses: actions/upload-artifact@v4
        if: contains(matrix.kernel.name, 'avd')
        with:
          name: kernel-Image-${{ matrix.kernel.name }}
          path: kernel/${{ matrix.kernel.name }}/kernel-Image-${{ matrix.kernel.name }}

  build-userspace:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - name: cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r28
          key: ndk-r28

      - name: install NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          rm android-ndk-r28-linux.zip

      - name: build binaries
        run: |
          CC=$PWD/android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          $CC -static -O2 -s -o debugd_unsafe module/memd_us.c
          $CC -static -O2 -s -o memtool module/memd_dump.c

      - uses: actions/upload-artifact@v4
        with:
          name: debugd_unsafe
          path: debugd_unsafe

      - uses: actions/upload-artifact@v4
        with:
          name: memtool
          path: memtool

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-kmod, build-userspace]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: collect artifacts
        run: |
          mkdir -p _release
          find _artifacts -type f \( -name "*.ko" -o -name "debugd_unsafe" -o -name "memtool" \) \
            -exec cp {} _release/ \;
          ls -lh _release/

      - uses: ncipollo/release-action@v1
        with:
          tag: beta
          name: "beta build"
          body: "auto-built from ${{ github.sha }}"
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: "_release/*"
