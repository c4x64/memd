name: build-kmod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kmod:
    runs-on: ubuntu-latest
    env:
      KVER: "5.15.137"
      LOCALVERSION: "-v5.21.770-optimizations-5.21.771.4051"
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev bison flex

      - name: Fetch & extract kernel source
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-$KVER.tar.xz
          tar xf linux-$KVER.tar.xz

      - name: Configure kernel to match vendor vermagic
        run: |
          cd linux-$KVER
          make ARCH=$ARCH defconfig
          scripts/config --disable LOCALVERSION_AUTO
          scripts/config --set-str LOCALVERSION "$LOCALVERSION"
          scripts/config --enable SMP
          scripts/config --enable PREEMPT
          scripts/config --enable PREEMPTION
          scripts/config --enable MODULE_UNLOAD
          scripts/config --enable MODVERSIONS
          scripts/config --enable ARM64 PORTABLE
          make ARCH=$ARCH olddefconfig
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE prepare modules_prepare scripts

      - name: Build kmod
        run: |
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE \
            KDIR=$PWD/linux-$KVER M=$PWD/kmod modules
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE \
            KDIR=$PWD/linux-$KVER M=$PWD/kmod modules

      - name: Show vermagic
        run: |
          modinfo kmod/lxgr_probe.ko || \
          aarch64-linux-gnu-objcopy -O binary --only-section=.modinfo \
            kmod/lxgr_probe.ko /dev/stdout | strings | grep -i vermagic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxgr_probe.ko
          path: kmod/lxgr_probe.ko