name: build-kmod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kmod:
    runs-on: ubuntu-latest
    env:
      KVER: "5.15.137"
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev bison flex

      - name: Fetch & extract kernel source
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-$KVER.tar.xz
          tar xf linux-$KVER.tar.xz

      - name: Configure kernel to match vendor vermagic
        run: |
          cd linux-$KVER
          make ARCH=$ARCH defconfig
          scripts/config --disable LOCALVERSION_AUTO
          scripts/config --set-str LOCALVERSION "-v5.21.770-optimizations-5.21.771.4051"
          scripts/config --enable MODULES
          scripts/config --enable MODULE_UNLOAD
          scripts/config --enable MODVERSIONS
          scripts/config --enable SMP
          scripts/config --enable PREEMPT
          make ARCH=$ARCH olddefconfig
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE prepare modules_prepare scripts
          # Populate modpost CRC table from the device kernel's own exported
          # symbol CRCs (extracted from /boot/bstmods/*.ko on the target), so
          # modpost writes matching __versions CRCs into our .ko. This makes
          # the loader CRC-verify our module and run module_init, without
          # compiling the entire in-tree module tree.
          # Format (v5.15 modpost read_dump): 0x<crc>\t<sym>\t<module>\t<export>\t<namespace>
          # CRCs extracted from /boot/bstmods/*.ko (device kernel ABI)
          printf '0x93375eb6\tmodule_layout\tvmlinux\tEXPORT_SYMBOL\t\n0x92997ed8\t_printk\tvmlinux\tEXPORT_SYMBOL\t\n0xc5383799\tparam_ops_int\tvmlinux\tEXPORT_SYMBOL\t\n' > "$GITHUB_WORKSPACE/linux-$KVER/Module.symvers"
          cat "$GITHUB_WORKSPACE/linux-$KVER/Module.symvers"

      - name: Build kmod
        run: |
          cd kmod
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE KDIR="$GITHUB_WORKSPACE/linux-$KVER"

      - name: Show vermagic
        run: |
          modinfo kmod/lxgr_probe.ko || \
          aarch64-linux-gnu-objcopy -O binary --only-section=.modinfo \
            kmod/lxgr_probe.ko /dev/stdout | strings | grep -i vermagic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxgr_probe.ko
          path: kmod/lxgr_probe.ko